# The Windows launcher (tools/launcher/, docs/launcher.md): built at each push, and attached to each release as
# rac1-launcher.exe, the one file Windows players download (and which updates itself from the latest release's).
# Its version is the release's (project(... VERSION) in CMakeLists.txt).
name: launcher

on:
  push:
    paths:
      - "tools/launcher/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "tools/launcher/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rac1-launcher.exe
    runs-on: windows-2022
    permissions:
      contents: write  # (gh release upload, on a release)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(\s*rac1-native\s+VERSION\s+(\d+\.\d+\.\d+)'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Build
        run: dotnet build tools/launcher/Launcher.csproj -c Release -p:LauncherVersion=${{ steps.version.outputs.version }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: rac1-launcher
          path: out/rac1-launcher.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/rac1-launcher.exe --clobber
